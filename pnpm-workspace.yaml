packages:
  - packages/*
# Supply-chain soak. `minimumReleaseAge` must live here rather than in `.npmrc`:
# pnpm only auto-enables `minimumReleaseAgeStrict` for values set in
# pnpm-workspace.yaml, config.yaml, the CLI or `pnpm_config_*` env vars. Set from
# `.npmrc` the soak stays in LOOSE mode, where an immature package is not rejected —
# pnpm appends it to `minimumReleaseAgeExclude` and installs it anyway.
# `minimumReleaseAgeStrict` is stated explicitly so the control cannot silently
# weaken if that defaulting ever changes.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
allowBuilds:
  esbuild: true
  fsevents: true
minimumReleaseAgeExclude:
  # type-plus@8.0.0-beta.10 fixes the CJS packaging defect in beta.8 that broke
  # require() of these packages. Taken before the 24h soak elapses; it is a
  # first-party dependency published via npm trusted publishing with SLSA
  # provenance (verified).
  #
  # tersify@4.0.6 and unpartial@1.0.7 are not a widening of the policy: they are
  # the exact versions type-plus@8.0.0-beta.10 requires (`tersify: ^4.0.6`,
  # `unpartial: ^1.0.7`), so the soak cannot admit beta.10 without them. Both are
  # first-party and carry the same trusted-publisher SLSA provenance (verified).
  #
  # Remove all three once the soak window has elapsed.
  - 'type-plus@8.0.0-beta.10'
  - 'tersify@4.0.6'
  - 'unpartial@1.0.7'
